name: Build APK

on:
  push:
    branches: [main, master]
    paths:
      - 'app.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter Android project
        run: flutter create --org com.qcapp --project-name qc_production --platforms=android build_app

      - name: Apply app files from app.zip
        run: |
          test -f app.zip || { echo "app.zip not found in repo root"; exit 1; }
          unzip -o app.zip -d build_app
          rm -rf build_app/test build_app/analysis_options.yaml
          test -f build_app/lib/main.dart || { echo "lib/main.dart missing: zip structure is wrong"; exit 1; }

      - name: Patch AndroidManifest (internet permission + app name)
        run: |
          python3 - <<'PY'
          import re
          p = 'build_app/android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          if 'android.permission.INTERNET' not in s:
              s = re.sub(r'(<manifest[^>]*>)', r'\1\n    <uses-permission android:name="android.permission.INTERNET"/>', s, count=1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="مراقبة الجودة"', s, count=1)
          open(p, 'w', encoding='utf-8').write(s)
          PY

      - name: Build release APK
        working-directory: build_app
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release

      - name: Prepare APK file
        run: cp build_app/build/app/outputs/flutter-apk/app-release.apk QC-App.apk

      - uses: actions/upload-artifact@v4
        with:
          name: QC-App-APK
          path: QC-App.apk

      - name: Publish as GitHub Release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: QC App - build ${{ github.run_number }}
          files: QC-App.apk
